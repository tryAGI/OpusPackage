name: Optimized Opus Release benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opus-release-benchmark:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Print Swift toolchain
        run: swift --version
      - name: Run optimized Release benchmark
        env:
          OPUS_RELEASE_BENCHMARK: "1"
        run: swift test --configuration release --jobs 2 --filter OpusReleaseBenchmarkTests
